name: Daily Commit Agent

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update daily activity log
        run: |
          mkdir -p logs
          DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "Daily automated commit: $DATE" >> logs/daily_activity.log

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/daily_activity.log
          git diff --cached --quiet || (git commit -m "chore: daily automated commit $(date -u '+%Y-%m-%d')" && git push)
